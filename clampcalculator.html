<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Use the Clamp() Calculator for responsive design with dynamic CSS clamp values. Easily set scalable sizes, margins & paddings, and save project presets.">
    <meta name="keywords" content="CSS Clamp, Clamp Calculator, Clamp Generator, Responsive Design, Web Development">
    <meta name="author" content="Happiness">
    <link rel="stylesheet" href="reset.css?v=1.6">
    <link rel="stylesheet" href="clampcalculator.css?v=1.65">
    <title>CSS Clamp Calculator – Generate Responsive clamp() Values and preset them</title>
  </head>
  <body>
    <h1>CSS Clamp() Calculator</h1>
    <main>
      <div class="centered-content">
        <div class="form-group form-group__breakpoint">
          <div class="form-item">
            <label for="breakpoint">Breakpoint (in px):</label>
            <input type="number" id="breakpoint" name="breakpoint" min="320" max="10000" value="1640">
          </div>
          <div class="form-item">
            <label for="breakpoint__list">Breakpoint preset:</label>
            <div id="breakpoint__list" class="faux__select">
              <button class="faux__select__trigger" aria-label="Select clamp preset">None</button>
              <div class="faux__select__form">
                <ul class="faux__select__list">
                  <li class="faux__select__item faux__select__item__placeholder">
                    <span class="preset__name">No items added</span>
                  </li>
                </ul>
                <form class="breakpoint__list__add">
                  <div class="breakpoint__list__add__formitem">
                    <label for="breakpoint__name">Project name:</label>
                    <input type="text" id="breakpoint__name" name="breakpoint__name">
                  </div>
                  <div class="breakpoint__list__add__formitem">
                    <label for="breakpoint__value">Breakpoint (in px):</label>
                    <input type="number" id="breakpoint__value" name="breakpoint__value" min="320" max="10000">
                  </div>
                  <div class="breakpoint__list__add__formitem">
                    <button type="submit" class="btn_small" aria-label="Add clamp preset">Add</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
        <div class="form-group form-group__max-value">
          <div class="form-item">
            <label for="max-value">Max value of clamp:</label>
            <input type="number" id="max-value" name="max-value" min="0" max="100" value="1.6" step="0.1">
          </div>
          <div class="form-item">
            <label for="unit">Unit:</label>
            <select id="unit" name="unit">
              <option value="rem">Rem</option>
              <option value="px">Px</option>
            </select>
          </div>
          <div class="form-item">
            <button id="reset-max-value">New max value</button>
          </div>
        </div>
        <div class="form-group form-group__submit">
          <div class="form-item">
            <button id="calculate" aria-label="Calculate CSS clamp values">Calculate</button>
          </div>
        </div>
        <div id="result-wrapper" class="form-group form-group__output">
          <div class="form-item">
            <div id="output"></div>
            <button id="copy-result" style="display: none;">Copy</button>
          </div>
        </div>
      </div>
    </main>
    <div class="disclaimer">
       For localStorage and usage information: <a href="https://clamp.hpns.dev/" title="Visit the fully fledged CSS clamp calculator" target="_blank" rel="noopener">CSS clamp() calculator web app.</a> The one here is kind of a sandbox.
    </div>
    <script src="clampcalculator.js?v=1.43"></script>
  </body>
</html>
